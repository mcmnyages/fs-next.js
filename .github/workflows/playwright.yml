
name: End-to-End Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: blogs-app

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: blogs-app/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 5. Create environment file
      - name: Set up environment variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        run: |
          cat > .env.test <<EOF
          DATABASE_URL=$DATABASE_URL
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          NEXTAUTH_URL=$NEXTAUTH_URL
          NODE_ENV=test
          EOF

      # 6. Verify environment variables
      - name: Verify environment setup
        run: |
          echo "Checking environment configuration..."

          for VAR in DATABASE_URL NEXTAUTH_SECRET NEXTAUTH_URL; do
            if grep -q "^${VAR}=." .env.test; then
              echo "✓ $VAR configured"
            else
              echo "✗ $VAR is missing or empty"
              exit 1
            fi
          done

      # 7. Run database migrations
      - name: Run database migrations
        run: npx drizzle-kit push

      # 8. Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      # 9. Upload Playwright HTML report
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: blogs-app/playwright-report/
          retention-days: 30

      # 10. Upload test results
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: blogs-app/test-results/
          retention-days: 30
